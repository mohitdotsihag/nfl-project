<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      padding: 35px 25px 60px;
    }

    /* -------------------------
       HEADER
    ------------------------- */

    h1 {
      text-align: center;
      margin: 0 0 30px;
      font-size: 28px;
    }

    /* -------------------------
       CUSTOMER NAME
    ------------------------- */

    .customer-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #dadce0;
      margin-bottom: 25px;
    }

    .customer-label {
      display: block;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .customer-input {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      outline: none;
    }

    .customer-input:focus {
      border-color: #1a73e8;
    }

    /* -------------------------
       CATEGORY BUTTONS
    ------------------------- */

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .category-button {
      width: 100%;
      padding: 20px;
      font-size: 19px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #1a73e8;
      color: white;
      cursor: pointer;
      transition: 0.15s;
    }

    .category-button:hover {
      background: #1557b0;
      transform: translateY(-1px);
    }

    /* -------------------------
       RESPONSE AREA
    ------------------------- */

    .response-area {
      margin-top: 30px;
    }

    .response-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .response-title {
      font-size: 22px;
      font-weight: bold;
    }

    .back-button {
      border: none;
      background: transparent;
      color: #1a73e8;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    /* -------------------------
       RESPONSE CARDS
    ------------------------- */

    .response-card {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      cursor: pointer;
      transition: 0.15s;
    }

    .response-card:hover {
      border-color: #1a73e8;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .situation {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .description {
      font-size: 14px;
      color: #5f6368;
      margin-bottom: 15px;
    }

    .response {
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .copy-hint {
      margin-top: 12px;
      font-size: 13px;
      color: #5f6368;
      text-align: right;
    }

    /* -------------------------
       COPY MESSAGE
    ------------------------- */

    .message {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #202124;
      color: white;
      padding: 14px 22px;
      border-radius: 8px;
      display: none;
      font-size: 15px;
      z-index: 1000;
    }

    /* -------------------------
       MOBILE
    ------------------------- */

    @media (max-width: 600px) {

      .categories {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 25px 15px 50px;
      }

      h1 {
        font-size: 24px;
      }

    }

    .footer {
  margin-top: 50px;
  padding: 15px 0;
  text-align: center;
  font-size: 11px;
  color: #9aa0a6;
  letter-spacing: 0.2px;
  }

  </style>

</head>


<body>

  <div class="container">

    <h1>Canned Response Tool</h1>


    <!-- CUSTOMER NAME -->

    <div class="customer-section">

      <label class="customer-label">
        Customer Name
      </label>

      <input
        id="customerName"
        class="customer-input"
        type="text"
        placeholder="Enter customer name"
      >

    </div>


    <!-- CATEGORY BUTTONS -->

    <div id="categories" class="categories">

      Loading categories...

    </div>


    <!-- RESPONSE AREA -->

    <div
      id="responseArea"
      class="response-area"
      style="display: none;"
    >

      <div class="response-header">

        <div
          id="responseTitle"
          class="response-title"
        >
        </div>

        <button
          class="back-button"
          onclick="showCategories()"
        >
          ← Back
        </button>

      </div>

      <div id="responses"></div>

    </div>


  </div>


  <!-- COPY NOTIFICATION -->

  <div
    id="message"
    class="message"
  >
    ✓ Response copied to clipboard
  </div>


  <script>

    let allResponses = [];


    // =========================================
    // LOAD DATA FROM GOOGLE SHEET
    // =========================================

    google.script.run

      .withSuccessHandler(function(data) {

        allResponses = data;

        buildCategoryButtons();

      })

      .withFailureHandler(function(error) {

        console.error(error);

        document.getElementById("categories").innerHTML =
          "<p>Could not load responses.</p>";

        alert("ERROR: " + error.message);

      })

      .getResponses();



    // =========================================
    // BUILD L1 CATEGORY BUTTONS
    // =========================================

    function buildCategoryButtons() {

      const container =
        document.getElementById("categories");

      container.innerHTML = "";


      // Find unique categories

      const categories = [
        ...new Set(
          allResponses.map(function(item) {
            return item.category;
          })
        )
      ];


      // Create a button for each category

      categories.forEach(function(category) {

        const button =
          document.createElement("button");

        button.className = "category-button";

        button.textContent =
          category.toUpperCase();

        button.addEventListener(
          "click",
          function() {
            showCategory(category);
          }
        );

        container.appendChild(button);

      });

    }



    // =========================================
    // SHOW L2 RESPONSES
    // =========================================

    function showCategory(category) {

      const categories =
        document.getElementById("categories");

      const responseArea =
        document.getElementById("responseArea");

      const responseTitle =
        document.getElementById("responseTitle");

      const responsesContainer =
        document.getElementById("responses");


      // Hide categories

      categories.style.display = "none";


      // Show response area

      responseArea.style.display = "block";


      // Set title

      responseTitle.textContent =
        category.toUpperCase();


      // Clear previous responses

      responsesContainer.innerHTML = "";


      // Find responses belonging to category

      const categoryResponses =
        allResponses.filter(function(item) {

          return item.category === category;

        });


      // Create L2 cards

      categoryResponses.forEach(function(item) {

        const card =
          document.createElement("div");

        card.className = "response-card";


        // Create situation heading

        const situation =
          document.createElement("div");

        situation.className = "situation";

        situation.textContent =
          item.situation;


        // Create description

        const description =
          document.createElement("div");

        description.className = "description";

        description.textContent =
          item.description;


        // Create response

        const response =
          document.createElement("div");

        response.className = "response";


        // Personalize response

        const personalizedResponse =
          personalizeResponse(item.response);


        response.textContent =
          personalizedResponse;


        // Copy hint

        const copyHint =
          document.createElement("div");

        copyHint.className = "copy-hint";

        copyHint.textContent =
          "Click anywhere to copy";


        // Put everything inside card

        card.appendChild(situation);

        card.appendChild(description);

        card.appendChild(response);

        card.appendChild(copyHint);


        // Copy when clicked

        card.addEventListener(
          "click",
          function() {

            copyResponse(
              personalizedResponse
            );

          }
        );


        responsesContainer.appendChild(card);

      });

    }



    // =========================================
    // PERSONALIZE RESPONSE
    // =========================================

    function personalizeResponse(response) {

      const customerName =
        document
          .getElementById("customerName")
          .value
          .trim();


      return response.replace(
        /{{CUSTOMER_NAME}}/g,
        customerName || "there"
      );

    }



    // =========================================
    // COPY RESPONSE
    // =========================================

    function copyResponse(response) {

      navigator.clipboard.writeText(response)

        .then(function() {

          showMessage();

        })

        .catch(function(error) {

          console.error(error);

          alert(
            "Could not copy response to clipboard."
          );

        });

    }



    // =========================================
    // SHOW COPY MESSAGE
    // =========================================

    function showMessage() {

      const message =
        document.getElementById("message");

      message.style.display =
        "block";


      setTimeout(function() {

        message.style.display =
          "none";

      }, 1500);

    }



    // =========================================
    // BACK TO CATEGORIES
    // =========================================

    function showCategories() {

      document
        .getElementById("responseArea")
        .style.display = "none";


      document
        .getElementById("categories")
        .style.display = "grid";

    }

  </script>

  <footer class="footer">
  Internal Support Utility · Build 1.0.0 · 2026 · Developed by Mohit S.
  </footer>

</body>

</html>
